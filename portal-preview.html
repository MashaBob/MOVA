<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVA Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#062635;color:white;font:16px system-ui}canvas{position:fixed;inset:0}header,footer{position:fixed;left:0;right:0;padding:22px;z-index:2}header{top:0;display:flex;justify-content:space-between}footer{bottom:0;text-align:center;background:linear-gradient(transparent,#041b2a 55%);padding-top:60px}b{font-size:30px;letter-spacing:5px}small{display:block;letter-spacing:2px;font-size:9px}button,select{font:inherit;color:white;background:#123d50;border:1px solid #80e8eb;border-radius:16px;padding:15px}button{display:block;width:min(100%,440px);margin:10px auto;font-weight:700}button:first-of-type{background:#70e0e4;color:#063346}#fallback{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#b4f8ff 0%,#218aa7 23%,#7af4ff 24%,#12677d 26%,#072b40 29%,#041725 70%)}#status{font-size:12px}</style><div id="fallback"></div><header><div><b>M◎VA</b><small>COMUNICA · APRENDE · CONECTA</small></div><select id="lang"><option>EN</option><option>ES</option><option>RU</option></select></header><footer><h1 id="title">Enter a new world of languages.</h1><p id="sub">Don't just learn a language. Live it.</p><button id="enter">Enter MOVA World →</button><button id="login">Sign in</button><p id="status">Loading 3D preview…</p></footer><script>const $=id=>document.getElementById(id);const labels={EN:['Enter a new world of languages.',"Don't just learn a language. Live it.",'Enter MOVA World →','Sign in'],ES:['Entra en un nuevo mundo de idiomas.','No solo aprendas un idioma. Vívelo.','Entrar a MOVA World →','Iniciar sesión'],RU:['Войди в новый мир языков.','Не просто учи язык. Живи им.','Войти в MOVA World →','Войти']};$('lang').onchange=()=>['title','sub','enter','login'].forEach((id,i)=>$(id).textContent=labels[$('lang').value][i]);$('login').onclick=()=>$('status').textContent='Authentication not connected';$('enter').onclick=()=>location.href='./index.html';</script><script type="module">try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');const s=new T.Scene();s.background=new T.Color(0x062635);const c=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(r.domElement);$('fallback').style.display='none';const g=new T.Group();s.add(g);for(let i=0;i<4;i++){const ring=new T.Mesh(new T.TorusGeometry(2.1+i*.13,.035+i*.015,12,100),new T.MeshBasicMaterial({color:[0x9affff,0x20b9d0,0x317c99,0x8ce9ee][i]}));ring.rotation.z=i;g.add(ring)}const light=new T.AmbientLight(0xffffff,2);s.add(light);const city=new T.Group();s.add(city);for(let i=0;i<45;i++){const h=.3+(i%7)*.23;const m=new T.Mesh(new T.BoxGeometry(.18,h,.2),new T.MeshStandardMaterial({color:0xb7e6e8}));m.position.set(Math.sin(i*2.4)*1.6,-1.6+h/2+(i%3)*.13,-2-(i%5)*.4);city.add(m)}const pos=[];for(let i=0;i<350;i++)pos.push(Math.sin(i*2.4)*3.5,Math.cos(i*1.7)*3.5,-(i%17)*.3);const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(pos,3));const stars=new T.Points(geo,new T.PointsMaterial({color:0x9bffff,size:.025}));s.add(stars);let x=0,go=false;function resize(){c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);c.position.z=Math.max(8,6/c.aspect)}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>x=(e.clientX/innerWidth-.5)*.5);$('enter').onclick=()=>{go=true;setTimeout(()=>location.href='./index.html',1600)};$('status').textContent='Live 3D · technical preview';r.setAnimationLoop(t=>{g.rotation.y=Math.sin(t*.0005)*.13;g.rotation.z=t*.0001;stars.rotation.z=t*.00008;c.position.x+=(x-c.position.x)*.04;if(go)c.position.z*=.975;c.lookAt(0,0,-1);r.render(s,c)})}catch(e){$('status').textContent='3D unavailable · fallback preview'}</script></html>
